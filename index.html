<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swordfall: Kingdoms — Local Test Harness</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            padding: 12px 24px;
            background: #16213e;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #0f3460;
        }
        header h1 {
            font-size: 1.2rem;
            color: #e94560;
        }
        header .info {
            font-size: 0.8rem;
            color: #888;
        }
        #controls {
            padding: 10px 24px;
            background: #16213e;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #0f3460;
        }
        #controls label { font-size: 0.85rem; color: #aaa; }
        #controls select, #controls button {
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #0f3460;
            background: #1a1a2e;
            color: #e0e0e0;
            font-size: 0.85rem;
            cursor: pointer;
        }
        #controls button:hover { background: #e94560; color: #fff; }
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #player-container {
            border: 2px solid #0f3460;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.15);
        }
        #player-container ruffle-embed,
        #player-container object,
        #player-container embed {
            display: block;
        }
        footer {
            padding: 8px;
            font-size: 0.75rem;
            color: #555;
        }
    </style>
</head>
<body>
    <header>
        <h1>⚔️ Swordfall: Kingdoms — Test Harness</h1>
        <span class="info" id="ruffle-version">Loading Ruffle…</span>
    </header>
    <div id="controls">
        <label for="swf-select">SWF:</label>
        <select id="swf-select">
            <option value="game/SFK_v2.swf" selected>SFK_v2.swf (modded build)</option>
            <option value="build/SFK_clean.swf">SFK_clean.swf (renamed, unpatched)</option>
            <option value="game/SFK.swf">SFK.swf (original)</option>
        </select>
        <button id="reload-btn">🔄 Reload</button>
        <button id="fullscreen-btn">⛶ Fullscreen</button>
    </div>
    <main>
        <div id="player-container">
            <ruffle-embed id="ruffle-player" src="game/SFK_v2.swf" width="800" height="600"></ruffle-embed>
        </div>
    </main>
    <footer>
        Ruffle Flash Emulator · Local dev only · Rebuild game/SFK_v2.swf with ./patch.sh
    </footer>

    <!-- Ruffle CDN -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const versionEl = document.getElementById("ruffle-version");
            const selectEl  = document.getElementById("swf-select");
            const reloadBtn = document.getElementById("reload-btn");
            const fsBtn     = document.getElementById("fullscreen-btn");
            const container = document.getElementById("player-container");

            // Show Ruffle version once loaded
            const checkRuffle = setInterval(() => {
                if (window.RufflePlayer) {
                    const ruffle = window.RufflePlayer.newest();
                    versionEl.textContent = "Ruffle loaded ✓";
                    clearInterval(checkRuffle);
                }
            }, 200);

            // Reload with selected SWF
            function loadSWF(src) {
                const player = document.getElementById("ruffle-player");
                if (player) player.remove();
                const embed = document.createElement("ruffle-embed");
                embed.id = "ruffle-player";
                embed.setAttribute("src", src);
                embed.setAttribute("width", "800");
                embed.setAttribute("height", "600");
                container.appendChild(embed);
            }

            reloadBtn.addEventListener("click", () => loadSWF(selectEl.value));
            selectEl.addEventListener("change", () => loadSWF(selectEl.value));

            // Fullscreen
            fsBtn.addEventListener("click", () => {
                const player = document.getElementById("ruffle-player");
                if (player?.requestFullscreen) player.requestFullscreen();
                else if (player?.webkitRequestFullscreen) player.webkitRequestFullscreen();
            });
        });
    </script>
</body>
</html>
